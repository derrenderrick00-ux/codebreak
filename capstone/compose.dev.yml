# Local development only. Credentials intentionally non-production.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: codebreak
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: codebreak
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - codebreak_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codebreak -d codebreak"]
      interval: 3s
      retries: 10
volumes:
  codebreak_postgres:
