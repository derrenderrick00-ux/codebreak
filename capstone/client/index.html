<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tower Control System · Capstone</title><link rel="stylesheet" href="style.css"></head><body><main><header><small>CODEBREAK / CAPSTONE</small><h1>Tower Control System</h1><p>Real full-stack practice · Express + PostgreSQL + JWT</p></header><section id="account"><h2>Register / Login</h2><form id="register"><label>Display name<input name="displayName" required autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password (12+ characters)<input name="password" type="password" minlength="12" required autocomplete="new-password"></label><button>Create account</button></form><form id="login"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button>Log in</button></form></section><section id="dashboard" hidden><div class="heading"><h2>Your cores</h2><button id="logout">Log out</button></div><form id="create"><label>Core name<input name="name" required maxlength="100"></label><label>Online <input name="online" type="checkbox"></label><button>Add core</button></form><ul id="core-list"></ul></section><p id="message" role="status" aria-live="polite"></p></main><script type="module" src="app.js"></script></body></html>
